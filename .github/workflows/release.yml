# Packages nsh-music for macOS, Linux and Windows. A tag `vX.Y.Z` publishes them as a GitHub release; running it by
# hand only builds them (workflow artifacts). The installers' asset names carry no version, so
# `releases/latest/download/<asset>`, which install.sh and install.ps1 use, always resolves. The versioned archives
# and `latest.json` beside them are what the app's updater (`nsh.json` "updater") fetches.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-24.04, asset: nsh-music-linux-x86_64.tar.gz, installer: website/public/install.sh }
          - { target: macos, os: macos-15, asset: nsh-music-macos-arm64.zip, installer: website/public/install.sh }
          - { target: windows, os: windows-latest, asset: nsh-music-windows-x86_64.zip, installer: website/public/install.ps1 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # QuickJS is C (bindgen needs libclang); the Linux host links GTK 4, WebKitGTK (NSH's web views), GStreamer
      # (NSH's audio) and ALSA (rodio).
      - name: Install clang, GTK 4, WebKitGTK, GStreamer and ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Windows builds use Inno Setup 6 (`ISCC.exe`) so `nsh package` emits both the portable `.zip` and `-setup.exe`.
      - name: Ensure Inno Setup 6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Find-Iscc {
            @(
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup 6' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The CLI of the commit Cargo.lock pins: the nightly prebuilt CLI while the tag still points there, otherwise one
      # built from that commit (`nightly` moves every night).
      - name: Install the locked NSH CLI
        run: bash .github/install-nsh.sh

      # The hosts the CLI generates call the API of the commit it was built from, and the app's crate links the one
      # Cargo.lock holds (see CONTRIBUTING.md). The nightly tag moves with NSH's main, so it can part from the lock:
      # a release then stops (move the lock with `cargo update -p nsh-core --precise <nightly hash>` and tag again);
      # a run by hand only warns. Checked in every job: the nightly can move between them.
      - name: Compare the CLI with the locked NSH
        run: |
          # Windows checkouts may end lines with CRLF.
          cli="$(nsh --version | tr -d '\r' | sed -n 's/.*(\([0-9a-f]\{7,\}\)[ )].*/\1/p')"
          locked="$(tr -d '\r' < Cargo.lock | grep -A2 '^name = "nsh-core"$' | sed -n 's/^source = ".*#\([0-9a-f]*\)"$/\1/p')"
          echo "nsh CLI: $cli, Cargo.lock: $locked"
          [ -n "$cli" ] && [ -n "$locked" ] || { echo "::error::Could not read the CLI or the locked NSH commit."; exit 1; }
          case "$locked" in
            "$cli"*) ;;
            *)
              message="The nightly nsh CLI ($cli) is not the NSH commit Cargo.lock holds ($locked); run cargo update -p nsh-core --precise <nightly hash>."
              if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::$message"; exit 1; fi
              echo "::warning::$message" ;;
          esac

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out"
          mkdir -p assets
          nsh package --target "$TARGET" -o "$out" "${args[@]}"
          ls -l "$out"
          # The installers' archive, and the versioned one for the updater.
          case "$TARGET" in
            linux) mv "$out/nsh-music.tar.gz" "assets/$ASSET"; mv "$out"/nsh-music-*.tar.gz assets/ ;;
            windows)
              # Assembled in the PowerShell step below so `.iss` and zip paths avoid MSYS path translation.
              ;;
            macos)
              ditto -c -k --keepParent "$out/nsh-music.app" "assets/$ASSET"
              dmg_dir="$RUNNER_TEMP/dmg"
              mkdir -p "$dmg_dir"
              cp -R "$out/nsh-music.app" "$dmg_dir/"
              ln -s /Applications "$dmg_dir/Applications"
              hdiutil create -volname "NSH Music" -srcfolder "$dmg_dir" -ov -format UDZO "assets/nsh-music-macos-arm64.dmg"
              rm -rf "$dmg_dir"
              mv "$out"/nsh-music-*.tar.gz assets/
              ;;
          esac
          ls -l assets

      - name: Assemble Windows setup and portable packages
        if: matrix.target == 'windows'
        env:
          ASSET: ${{ matrix.asset }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'out'
          $iss = Join-Path $out 'nsh-music.iss'
          # Purge app data, cache, logs and NetEase session on uninstall so setup leaves no residue.
          @'

          [UninstallDelete]
          Type: filesandordirs; Name: "{userappdata}\io.github.duskriver.nsh-music"
          Type: filesandordirs; Name: "{localappdata}\io.github.duskriver.nsh-music"
          Type: filesandordirs; Name: "{localappdata}\nsh-music"
          '@ | Add-Content -Path $iss -Encoding Ascii
          & $env:ISCC_PATH /Q "/O$out" $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Move-Item -Force (Join-Path $out 'nsh-music-setup.exe') 'assets\nsh-music-windows-x86_64-setup.exe'
          Get-ChildItem -Path $out -Filter 'nsh-music-*.zip' | Move-Item -Force -Destination 'assets\'

          # Ship the isolated launcher only inside the portable zip, keeping the installed copy clean.
          Copy-Item -Force 'scripts\nsh-music-portable.cmd' (Join-Path $out 'nsh-music\nsh-music-portable.cmd')
          Compress-Archive -Path (Join-Path $out 'nsh-music') -DestinationPath (Join-Path 'assets' $env:ASSET) -Force
          Get-ChildItem -Path 'assets' | Format-Table Name, Length -AutoSize

      - name: Verify the macOS package
        if: matrix.target == 'macos'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app="$RUNNER_TEMP/verify/nsh-music.app"
          ditto -x -k "assets/$ASSET" "$RUNNER_TEMP/verify"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          codesign --verify --deep --strict "$app"

      # The installer, run against this package served locally.
      - name: Try the installer on this package
        env:
          ASSET: ${{ matrix.asset }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          (cd assets && { command -v sha256sum > /dev/null && sha256sum "$ASSET" || shasum -a 256 "$ASSET"; } > sha256sums)
          python=python3; command -v python3 > /dev/null || python=python
          (cd assets && exec "$python" -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          export NSH_MUSIC_BASE_URL=http://127.0.0.1:8765
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -ExecutionPolicy Bypass -File "$INSTALLER"
              test -f "$LOCALAPPDATA/Programs/nsh-music/nsh-music.exe"
              test -f "$LOCALAPPDATA/Programs/nsh-music/nsh-music-portable.cmd"
              rm -rf "$LOCALAPPDATA/Programs/nsh-music"
              powershell -NoProfile -Command '
                $p = Start-Process -FilePath "assets/nsh-music-windows-x86_64-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
                if ($p.ExitCode -ne 0) { exit $p.ExitCode }
              '
              test -f "$LOCALAPPDATA/Programs/nsh-music/nsh-music.exe"
              test -f "$LOCALAPPDATA/Programs/nsh-music/unins000.exe"
              test ! -e "$LOCALAPPDATA/Programs/nsh-music/nsh-music-portable.cmd"
              mkdir -p "$APPDATA/io.github.duskriver.nsh-music" "$LOCALAPPDATA/io.github.duskriver.nsh-music" "$LOCALAPPDATA/nsh-music"
              touch "$APPDATA/io.github.duskriver.nsh-music/test" "$LOCALAPPDATA/io.github.duskriver.nsh-music/test" "$LOCALAPPDATA/nsh-music/test"
              powershell -NoProfile -Command '
                $app = Join-Path $env:LOCALAPPDATA "Programs\nsh-music"
                $p = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
                if ($p.ExitCode -ne 0) { exit $p.ExitCode }
                for ($i = 0; $i -lt 30; $i++) {
                  if (-not (Test-Path $app)) { break }
                  Start-Sleep -Milliseconds 500
                }
              '
              test ! -e "$LOCALAPPDATA/Programs/nsh-music"
              test ! -e "$APPDATA/io.github.duskriver.nsh-music"
              test ! -e "$LOCALAPPDATA/io.github.duskriver.nsh-music"
              test ! -e "$LOCALAPPDATA/nsh-music" ;;
            macOS)
              bash "$INSTALLER"
              codesign --verify --deep --strict /Applications/nsh-music.app ;;
            Linux)
              bash "$INSTALLER"
              test -x "$HOME/.local/share/nsh-music-app/nshmusic"
              test -x "$HOME/.local/bin/nsh-music"
              ls "$HOME"/.local/share/applications/*.desktop ;;
          esac
          rm assets/sha256sums

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: assets/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # `nsh update-manifest`. Building the locked CLI needs clang for QuickJS.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the locked NSH CLI
        run: bash .github/install-nsh.sh
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Release file names are lowercase (nsh names the updater's archives after the app, nsh-music-<version>-...).
      - name: Lowercase asset names
        run: |
          cd assets
          for f in *; do l=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]'); [ "$f" = "$l" ] || mv "$f" "$l"; done
          ls -l
      # The app fetches `releases/latest/download/latest.json` and the versioned archives it names (nsh/updater).
      - name: Write the update manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" nsh.json
          archives=()
          for f in assets/nsh-music-"$version"-*.tar.gz assets/nsh-music-"$version"-*.zip; do
            [ -f "$f" ] && archives+=("$f")
          done
          if [ ${#archives[@]} -gt 0 ]; then
            nsh update-manifest "${archives[@]}" --out assets
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum * > sha256sums
          cat sha256sums

          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/release-notes.md"
          sed -e "s|__VERSION__|$version|g" -e "s|__BASE__|$base|g" -e "s|__REPO__|$GH_REPO|g" > "$notes" <<'EOF'
          ## 下载指南 / Downloads

          > 请根据你的系统选择下面**加粗推荐**的文件即可；附件中带版本号的 `nsh-music-__VERSION__-*`、`latest.json` 与 `sha256sums` 供应用内自动更新与校验使用，**普通用户无需手动下载**。

          | 平台 | 推荐下载 | 说明 |
          | --- | --- | --- |
          | **Windows (x86_64)** | [**`nsh-music-windows-x86_64-setup.exe`**](__BASE__/nsh-music-windows-x86_64-setup.exe) | **安装包（推荐）**：双击向导安装，支持桌面/开始菜单快捷方式，卸载时全量清除不留残留 |
          | **Windows (x86_64)** | [`nsh-music-windows-x86_64.zip`](__BASE__/nsh-music-windows-x86_64.zip) | **绿色便携版**：免安装，解压后双击内附 `nsh-music-portable.cmd` 启动，数据全部留在 `data\` 内 |
          | **macOS (Apple Silicon)** | [**`nsh-music-macos-arm64.dmg`**](__BASE__/nsh-music-macos-arm64.dmg) | **DMG 安装包（推荐）**：打开后将 `nsh-music` 拖入 `Applications` 即可 |
          | **macOS (Apple Silicon)** | [`nsh-music-macos-arm64.zip`](__BASE__/nsh-music-macos-arm64.zip) | 压缩包版本 |
          | **Linux (x86_64)** | [**`nsh-music-linux-x86_64.tar.gz`**](__BASE__/nsh-music-linux-x86_64.tar.gz) | 需 GTK 4.14+ 与 ALSA |

          ### 命令行一键安装（自动校验 SHA-256）

          - **Windows (PowerShell)**：
            ```powershell
            irm https://raw.githubusercontent.com/__REPO__/main/website/public/install.ps1 | iex
            ```
          - **macOS / Linux**：
            ```sh
            curl -fsSL https://raw.githubusercontent.com/__REPO__/main/website/public/install.sh | bash
            ```

          > **macOS 首次打开提示「无法验证开发者」或「已损坏」**：可在终端执行 `xattr -cr /Applications/nsh-music.app`，或在访达中按住 Control 右键点击应用选择「打开」。
          EOF

          if generated="$(gh api "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$GITHUB_REF_NAME" --jq '.body' 2>/dev/null)" && [ -n "$generated" ]; then
            printf '\n---\n\n%s\n' "$generated" >> "$notes"
          fi

          upload_args=()
          for f in *; do
            case "$f" in
              nsh-music-windows-x86_64-setup.exe)
                upload_args+=("$f#Windows (x86_64) 安装包（推荐）— $f") ;;
              nsh-music-windows-x86_64.zip)
                upload_args+=("$f#Windows (x86_64) 绿色便携版 — $f") ;;
              nsh-music-macos-arm64.dmg)
                upload_args+=("$f#macOS (Apple Silicon) DMG 安装包（推荐）— $f") ;;
              nsh-music-macos-arm64.zip)
                upload_args+=("$f#macOS (Apple Silicon) 压缩包 — $f") ;;
              nsh-music-linux-x86_64.tar.gz)
                upload_args+=("$f#Linux (x86_64) 压缩包 — $f") ;;
              sha256sums)
                upload_args+=("$f#校验文件（SHA-256）— $f") ;;
              latest.json|nsh-music-"$version"-*)
                upload_args+=("$f#自动更新组件（无需手动下载）— $f") ;;
              *)
                upload_args+=("$f") ;;
            esac
          done

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "nsh-music $GITHUB_REF_NAME" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "${upload_args[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${upload_args[@]}" --verify-tag --notes-file "$notes" --title "nsh-music $GITHUB_REF_NAME"
          fi
