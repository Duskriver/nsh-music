[package]
name = "nsh-app-spotish"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
# The app's UI set (a library the CLI links into its generated hosts).

[dependencies]
# NSH's core at the checkout the CLI was built from (nightly f81b965).
nsh-core = { path = "../nsh.worktrees/nshtify-base/crates/nsh-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nsh-engine = { path = "../nsh.worktrees/nshtify-base/crates/nsh-engine" }
nsh-testing = { path = "../nsh.worktrees/nshtify-base/crates/nsh-testing" }
